    <script>
      (function() {
        // Intercept Vite HMR / ping WebSockets in sandboxed iframe where HMR is disabled
        var OrigWebSocket = window.WebSocket;
        if (OrigWebSocket) {
          var PatchedWebSocket = function(url, protocols) {
            var protoStr = Array.isArray(protocols) ? protocols.join(',') : String(protocols || '');
            var urlStr = String(url || '');
            if (
              protoStr.indexOf('vite-hmr') !== -1 ||
              protoStr.indexOf('vite-ping') !== -1 ||
              urlStr.indexOf('token=') !== -1
            ) {
              var fakeTarget = new EventTarget();
              fakeTarget.readyState = 1;
              fakeTarget.send = function() {};
              fakeTarget.close = function() {};
              setTimeout(function() {
                try {
                  var openEvt = new Event('open');
                  if (typeof fakeTarget.onopen === 'function') fakeTarget.onopen(openEvt);
                  fakeTarget.dispatchEvent(openEvt);
                } catch (_) {}
              }, 10);
              return fakeTarget;
            }
            return protocols !== undefined
              ? new OrigWebSocket(url, protocols)
              : new OrigWebSocket(url);
          };
          PatchedWebSocket.prototype = OrigWebSocket.prototype;
          PatchedWebSocket.CONNECTING = OrigWebSocket.CONNECTING;
          PatchedWebSocket.OPEN = OrigWebSocket.OPEN;
          PatchedWebSocket.CLOSING = OrigWebSocket.CLOSING;
          PatchedWebSocket.CLOSED = OrigWebSocket.CLOSED;
          window.WebSocket = PatchedWebSocket;
        }

        // Suppress Vite websocket & HMR closed errors which are expected in sandbox iframe
        var isWsError = function(str) {
          if (!str) return false;
          var s = String(str).toLowerCase();
          return s.indexOf('websocket') !== -1 ||
                 s.indexOf('failed to connect to websocket') !== -1 ||
                 s.indexOf('vite:ws') !== -1 ||
                 s.indexOf('websocket closed without opened') !== -1;
        };

        var origError = console.error;
        console.error = function() {
          var args = Array.prototype.slice.call(arguments);
          var str = args.map(function(a) { return String((a && (a.stack || a.message)) || a || ''); }).join(' ');
          if (isWsError(str)) {
            return;
          }
          return origError.apply(console, arguments);
        };

        var origWarn = console.warn;
        console.warn = function() {
          var args = Array.prototype.slice.call(arguments);
          var str = args.map(function(a) { return String((a && (a.stack || a.message)) || a || ''); }).join(' ');
          if (isWsError(str)) {
            return;
          }
          return origWarn.apply(console, arguments);
        };

        window.addEventListener('error', function(e) {
          var msg = (e && (e.message || (e.error && e.error.message))) || '';
          if (isWsError(msg)) {
            e.preventDefault();
            e.stopImmediatePropagation();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(e) {
          var reason = e ? e.reason : '';
          var msg = typeof reason === 'string' ? reason : (reason && (reason.message || reason.stack)) || '';
          if (isWsError(msg)) {
            e.preventDefault();
            e.stopImmediatePropagation();
            return true;
          }
        }, true);

        // Remove vite error overlay if it attempts to display websocket closed
        var observer = new MutationObserver(function(mutations) {
          var overlay = document.querySelector('vite-error-overlay');
          if (overlay) {
            var text = overlay.shadowRoot ? overlay.shadowRoot.textContent : overlay.textContent;
            if (isWsError(text)) {
              overlay.remove();
            }
          }
        });
        observer.observe(document.documentElement, { childList: true, subtree: true });
      })();
    </script>
